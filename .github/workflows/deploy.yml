# Builds the app and publishes it to GitHub Pages (D68, D70):
# https://hayew.github.io/dm-sidekick/
# Every push to main deploys, but only if `npm run check` passes; a failing check leaves the
# previous version online. "Run workflow" on the Actions tab deploys by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # No install scripts, as locally (CLAUDE.md); esbuild works without its postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the job that publishes may publish; build runs npm ci and all dev tooling.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
